# Tests and builds the Python packages in packages/. See packages/README.md.
name: packages

on:
  pull_request:
    paths:
      - "packages/**"
      # the kipoi-enformer tests read these example files
      - "example/chr22_hg19.fa*"
      - "example/chr22.gencode.v40lift37.annotation.gff3.gz"
      - ".github/workflows/packages.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      # the kipoi-enformer tests read these example files
      - "example/chr22_hg19.fa*"
      - "example/chr22.gencode.v40lift37.annotation.gff3.gz"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-abexp-utils:
    name: abexp-utils tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/abexp_utils/pyproject.toml
      # the spark tests need Java; pyspark 3.4 and later support Java 17
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install "./packages/abexp_utils[all,dev]"
      - run: pytest
        working-directory: packages/abexp_utils

  test-kipoi-enformer:
    name: kipoi-enformer tests
    runs-on: ubuntu-latest
    env:
      TEST_DATA: packages/kipoi_enformer/tests/data/**
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - name: Hash the list of LFS objects in the test data
        id: lfs
        run: echo "hash=$(git lfs ls-files --long --include="$TEST_DATA" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-kipoi-enformer-test-data-${{ steps.lfs.outputs.hash }}
      # .lfsconfig excludes the test data from the default fetch; --exclude="" lifts that
      - name: Fetch the test data from git-lfs
        run: git lfs pull --include="$TEST_DATA" --exclude=""
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/kipoi_enformer/pyproject.toml
      - run: pip install "./packages/kipoi_enformer[dev]"
      - run: pytest
        working-directory: packages/kipoi_enformer

  build:
    name: build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [abexp_utils, kipoi_enformer]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build "packages/${{ matrix.package }}" --outdir dist
      - run: twine check --strict dist/*
      - name: Warn about direct URL dependencies
        run: |
          # PyPI rejects a Requires-Dist with a direct URL ("name @ url")
          unzip -p dist/*.whl '*.dist-info/METADATA' | grep '^Requires-Dist: .* @ ' > direct-urls.txt || true
          while IFS= read -r line; do
            echo "::warning title=Direct URL dependency::PyPI rejects ${line#Requires-Dist: }"
          done < direct-urls.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.package }}
          path: dist/
          if-no-files-found: error
