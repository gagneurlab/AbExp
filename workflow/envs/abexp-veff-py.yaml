name: abexp-veff-py

channels:
- conda-forge

dependencies:
# Snakemake 9 needs >=3.11 and aberrant-expression >=3.12. The tests of aberrant-expression run on 3.12.
# A range instead of an exact pin makes the solve take minutes.
- python=3.12
- ipykernel
- pandas
- pyarrow
- numpy
- scipy
- joblib
- scikit-learn
- lightgbm>=4,<5
- tqdm
- statsmodels
- polars>=1.44
- bioconda::bcftools
- bioconda::tabix
- bioconda::pyfaidx
- bioconda::vcf2parquet>=0.4
- wget
# aria2c and kagglehub for the download rules, which have no conda environment (see README)
- aria2
- kagglehub
# Snakemake and snakemk_util allow to run the scripts as notebooks (see README)
- bioconda::snakemake>=9
- bioconda::snakemk_util>=3
- pip
- pip:
  # packages/aberrant_expression of this repository at its release tag. release-please bumps the tag.
  - "aberrant-expression[polars] @ git+https://github.com/gagneurlab/AbExp.git@aberrant-expression-v0.1.1#subdirectory=packages/aberrant_expression"  # x-release-please-version
