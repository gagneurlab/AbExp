# TensorFlow environment of the modules enformer and absplice (MMSplice, SpliceAI, SpliceAI-RocksDB and
# AbSplice-DNA).
# abexp-tensorflow-cuda.yaml is the same with the CUDA build of TensorFlow.
name: abexp-tensorflow-cpu
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12 # the newest Python with tensorflow 2.21 builds on conda-forge
  - tensorflow-cpu=2.21 # the CPU build of tensorflow 2.21, also on hosts with a CUDA driver
  - pandas
  - pyarrow
  - polars>=1.44
  - xarray
  # not imported by the rules, but dependencies of aberrant-expression and kipoiseq2: conda installs them, not pip
  - kagglehub # downloads the Enformer model
  - scikit-learn
  - zarr
  - polars-bio>=0.36.0
  - pyfaidx
  # dependencies of spliceai and aberrant-expression
  - pysam
  - python-rocksdb>=0.7
  - tqdm
  - click
  - onnxruntime # runs the AbSplice-DNA model of abexp.absplice
  - pip
  - pip:
    # packages/aberrant_expression of this repository at its release tag. release-please bumps the tag.
    - "aberrant-expression[enformer,splicing,rocksdb] @ git+https://github.com/gagneurlab/AbExp.git@aberrant-expression-v0.1.0#subdirectory=packages/aberrant_expression"  # x-release-please-version
    # SpliceAI of the branch mnp, which predicts multi-nucleotide variants
    - "spliceai @ git+https://github.com/hoeze/SpliceAI.git@e3470ae185d1418fe40cf35e8c4e33431cbc5df2"
