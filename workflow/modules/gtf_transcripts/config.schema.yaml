$schema: "https://json-schema.org/draft/2020-12/schema"
title: gtf_transcripts module
description: Converts the transcripts of a GTF file to parquet.
type: object
additionalProperties: false

properties:
  gtf_file:
    type: string
    description: Genome annotation with Ensembl gene and transcript identifiers, e.g. from GENCODE.
  output_dir:
    type: string
    description: The output is <output_dir>/gtf_transcripts.parquet.

required:
  - gtf_file
  - output_dir
