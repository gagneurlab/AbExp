# The absplice2 module: abexp.pangolin, which runs the published Pangolin weights with PyTorch, and
# abexp.absplice2, which scores the variants with the AbSplice2 model.
# absplice2-cpu.yaml is the same with the CPU build of PyTorch.
name: abexp-absplice2-cuda

channels:
- conda-forge
- bioconda

dependencies:
- python=3.12
- pytorch-gpu>=2.4 # the CUDA build of pytorch, also on hosts without a GPU
- ipython
- numpy
- pandas
- pyarrow
- polars>=1.44
- scikit-learn
- scipy
- joblib
# not imported by the rules, but dependencies of aberrant-expression and kipoiseq2: conda installs them, not pip
- polars-bio>=0.36.0
- pyfaidx
- pip
- pip:
  # reads the AbSplice2 model, an ExplainableBoostingClassifier of interpret 0.2.7
  - interpret-core==0.2.7
  # packages/aberrant_expression of this repository at its release tag. release-please bumps the tag.
  - "aberrant-expression[absplice2,pangolin] @ git+https://github.com/gagneurlab/AbExp.git@aberrant-expression-v0.1.0#subdirectory=packages/aberrant_expression"  # x-release-please-version
