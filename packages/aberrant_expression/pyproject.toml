[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aberrant-expression"
version = "0.1.1"
description = "Utilities, Enformer, MMSplice, AbSplice-DNA, SpliceAI-RocksDB, Pangolin and AbSplice2-DNA for the AbExp pipeline"
authors = [
    { name = "Florian Hölzlwimmer", email = "git.ich@frhoelzlwimmer.de" },
    { name = "George Tsitsiridis", email = "gtsitsiridis@gmail.com" },
    # the authors of the ported code of mmsplice, absplice, splicemap and spliceai_rocksdb
    { name = "Jun Cheng" },
    { name = "Muhammed Hasan Çelik" },
    { name = "Nils Wagner" },
]
maintainers = [
    { name = "Florian Hölzlwimmer", email = "git.ich@frhoelzlwimmer.de" },
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["aberrant expression", "variant effect prediction", "splicing", "mmsplice", "absplice", "spliceai",
    "pangolin", "enformer", "deep learning", "computational biology", "bioinformatics", "genomics"]
# The base has no dependencies, because the package root and abexp.utils.common need only the standard library.
# Each extra adds the dependencies of some subpackages. Each third-party requirement appears once in this file, with
# its version range. An extra that needs it refers to the extra that holds it, e.g. "aberrant-expression[gff3]".
dependencies = []

[project.optional-dependencies]
# abexp.utils.models
models = [
    "aberrant-expression[numpy]",
    "scikit-learn>=1.4.1.post1",
]
# abexp.utils.polars_functions
polars = [
    "polars>=1.44",
]
# abexp.utils.spark_functions; displayHead returns a pandas DataFrame
spark = [
    "pyspark>=3.4",
    "pandas",
]
# abexp.utils.gff3
gff3 = [
    "aberrant-expression[polars]",
    # polars-bio 0.36.0 allows polars 2, but breaks on it in scan_table and read_table with a schema (polars-bio
    # PR #475). polars-bio 0.36.1 requires polars below 2.
    "polars-bio>=0.36.1",
]
# abexp.mmsplice and abexp.absplice
splicing = [
    "aberrant-expression[polars,numpy,kipoiseq2,tensorflow,tqdm]",
    "onnxruntime",
]
# SpliceAI-RocksDB (abexp.spliceai_rocksdb). SpliceAI predictions of the variants that are not in the database
# also need spliceai, see the README.
rocksdb = [
    "aberrant-expression[splicing]",
    "python-rocksdb>=0.7",
]
# abexp.enformer. xarray brings pandas.
enformer = [
    "aberrant-expression[gff3,models,kipoiseq2,tensorflow,tqdm]",
    # downloads the Enformer model
    "kagglehub",
    "pyarrow",
    "xarray>=2024.5.0",
    "zarr>=2.15.0",
    "pyyaml",
]
# abexp.pangolin; conda-forge has PyTorch as pytorch-cpu and pytorch-gpu
pangolin = [
    "aberrant-expression[gff3,numpy,kipoiseq2]",
    "torch>=2.4",
]
# abexp.absplice2
absplice2 = [
    "aberrant-expression[polars]",
]
# all extras but rocksdb, because pip builds python-rocksdb only with the RocksDB library installed
all = [
    "aberrant-expression[models,polars,spark,gff3,splicing,enformer,pangolin,absplice2]",
]
# Requirements of several extras. Each of these extras holds one requirement and has its name.
numpy = [
    "numpy>=1.26.4",
]
kipoiseq2 = [
    "kipoiseq2[ranges]>=0.1,<0.2",
]
tensorflow = [
    "tensorflow>=2.14.0",
]
tqdm = [
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/gagneurlab/AbExp"
Source = "https://github.com/gagneurlab/AbExp/tree/main/packages/aberrant_expression"
Issues = "https://github.com/gagneurlab/AbExp/issues"

# The tools that run the tests. The uv workspace at the repository root holds their version ranges.
[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["abexp", "abexp.*"]

[tool.setuptools.package-data]
"abexp.mmsplice" = ["models/*.h5"]
"abexp.absplice" = ["precomputed/*"]

[tool.pytest.ini_options]
addopts = [
    # Pass -n0 to turn this off, which a debugger needs and which restores per-test output order.
    "-n", "auto",
    # One worker runs the tests of each xdist_group, one after the other: the Spark tests and the tests that run
    # Enformer, see tests/utils/test_spark.py and tests/enformer/test_enformer.py.
    "--dist", "loadgroup",
]
