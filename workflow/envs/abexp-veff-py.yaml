name: abexp-veff-py

channels:
- conda-forge

dependencies:
# Snakemake 9 needs >=3.11; lightgbm 3.3 (for the shipped models) has builds for 3.11
- python=3.11
- ipykernel
- pandas
- pyarrow
- numpy
- scipy
- joblib
- scikit-learn
- lightgbm~=3.3
- tqdm
- statsmodels
- polars~=1.44
- bioconda::bcftools
- bioconda::tabix
- bioconda::pyfaidx
- bioconda::pyranges
- bioconda::vcf2parquet>=0.4
- wget
# aria2c and kagglehub for the download rules, which have no conda environment (see README)
- aria2
- kagglehub
# Snakemake and snakemk_util allow to run the scripts as notebooks (see README)
- bioconda::snakemake>=9
- bioconda::snakemk_util>=3
- pip
- pip:
  # packages/abexp_utils of this repository at its release tag. release-please bumps the tag.
  - "abexp-utils[polars] @ git+https://github.com/gagneurlab/AbExp.git@abexp-utils-v0.0.1#subdirectory=packages/abexp_utils"  # x-release-please-version
