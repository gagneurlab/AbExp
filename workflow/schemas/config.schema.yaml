                - "Artery - Tibial"
                - "Brain - Amygdala"
                - "Brain - Anterior cingulate cortex (BA24)"
                - "Brain - Caudate (basal ganglia)"
                - "Brain - Cerebellar Hemisphere"
                - "Brain - Cerebellum"
                - "Brain - Cortex"
                - "Brain - Frontal Cortex (BA9)"
                - "Brain - Hippocampus"
                - "Brain - Hypothalamus"
                - "Brain - Nucleus accumbens (basal ganglia)"
                - "Brain - Putamen (basal ganglia)"
                - "Brain - Spinal cord (cervical c-1)"
                - "Brain - Substantia nigra"
                - "Breast - Mammary Tissue"
                - "Cells - EBV-transformed lymphocytes"
                - "Cells - Cultured fibroblasts"
                - "Colon - Sigmoid"
                - "Colon - Transverse"
                - "Esophagus - Gastroesophageal Junction"
                - "Esophagus - Mucosa"
                - "Esophagus - Muscularis"
                - "Heart - Atrial Appendage"
                - "Heart - Left Ventricle"
                - "Kidney - Cortex"
                - "Liver"
                - "Lung"
                - "Minor Salivary Gland"
                - "Muscle - Skeletal"
                - "Nerve - Tibial"
                - "Ovary"
                - "Pancreas"
                - "Pituitary"
                - "Prostate"
                - "Skin - Not Sun Exposed (Suprapubic)"
                - "Skin - Sun Exposed (Lower leg)"
                - "Small Intestine - Terminal Ileum"
                - "Spleen"
                - "Stomach"
                - "Testis"
                - "Thyroid"
                - "Uterus"
                - "Vagina"
                - "Whole Blood"
          abexp_v1.1:
            $ref: "#/$defs/model"
            default:
              model: "{ABEXP_DIR}/resources/models/abexp_v1.1/model.joblib"
              features: "{ABEXP_DIR}/resources/models/abexp_v1.1/features.yaml"
              cutoffs:
                high_confidence: 3.83833533874002
                low_confidence: 1.63628553283956
              predict_tissues: *v1_1_tissues
          abexp_v1.1_Enformer:
            $ref: "#/$defs/model"
            default:
              model: "{ABEXP_DIR}/resources/models/abexp_v1.1_Enformer/model.joblib"
              features: "{ABEXP_DIR}/resources/models/abexp_v1.1_Enformer/features.yaml"
              cutoffs:
                high_confidence: 3.83833533874002
                low_confidence: 1.63628553283956
              predict_tissues: *v1_1_tissues

required:
  - vcf_input_dir
  - output_dir
  - human_genome_version
  - fasta_file
  - gff3_file

$defs:
  model:
    type: object
    additionalProperties: false
    properties:
      model:
        type: string
      features:
        type: string
      cutoffs:
        type: object
        properties:
          high_confidence:
            type: number
          low_confidence:
            type: number
      predict_tissues:
        type: array
        items:
          type: string
    required: ["model", "features"]
