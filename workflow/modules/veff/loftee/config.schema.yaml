$schema: "https://json-schema.org/draft/2020-12/schema"
title: loftee module
description: >-
  Annotates loss-of-function variants with reloftee (not published yet),
  a VEP-free reimplementation of LOFTEE, and writes its per-transcript table unchanged.
  Downloads the LOFTEE data that it reads, unless the paths below point at existing files.
type: object
additionalProperties: false

properties:
  vcf:
    type: string
    pattern: "\\{vcf_file\\}"
    description: >-
      Input VCFs, as a pattern with the wildcard {vcf_file}. They must be left-normalized
      and single-allelic, e.g. the stripped VCFs of the vcf_prep module.
  output_dir:
    type: string
    description: The output is <output_dir>/loftee/veff.parquet/<vcf_file>.parquet.
  resources_dir:
    type: string
    description: >-
      Base of the default LOFTEE data paths, <resources_dir>/loftee/<assembly>. Default is
      <output_dir>/resources.
  human_genome_version:
    type: string
    enum: ["hg19", "hg38"]
  fasta_file:
    type: string
    description: >-
      Genome FASTA, the same file used by the rest of the pipeline. reloftee matches
      chromosome names with and without a "chr" prefix, so it does not need to match
      genome_annotation's own naming.
  fasta_file_idx:
    type: string
    description: Index of `fasta_file`. Default is `fasta_file` + ".fai".
  genome_annotation:
    type: string
    description: >-
      GTF or GFF3 transcript annotation from Ensembl or GENCODE (gzip allowed), of the same
      assembly as fasta_file. The veff module passes its `gff3_file` by default. GENCODE
      annotation needs a reloftee version that reads GENCODE; older versions build zero
      transcript models from it.
  gerp_bigwig:
    type: ["string", "null"]
    description: >-
      GERP conservation bigWig; enables the END_TRUNC filter. Default for GRCh38 is
      <resources_dir>/loftee/GRCh38/gerp_conservation_scores.homo_sapiens.GRCh38.bw, downloaded
      if missing (12.6 GB). null skips the filter, and is the default for GRCh37: LOFTEE has no
      GERP bigWig for GRCh37.
  human_ancestor_fa:
    type: ["string", "null"]
    description: >-
      Human ancestor FASTA with its samtools indexes (.fai, .gzi); enables the ANC_ALLELE flag.
      Default is <resources_dir>/loftee/<assembly>/human_ancestor.fa.gz, downloaded if missing
      (0.9 GB). null skips the flag.
  phylocsf_sqlite:
    type: ["string", "null"]
    description: >-
      PhyloCSF SQLite database with the table phylocsf_summary; enables the PHYLOCSF_* flags
      and the SINGLE_EXON filter. Default for GRCh38 is <resources_dir>/loftee/GRCh38/loftee.sql,
      downloaded if missing (0.15 GB). null skips them, and is the default for GRCh37: LOFTEE's
      phylocsf_gerp.sql for GRCh37 lacks the table phylocsf_summary.
  min_intron_size:
    type: integer
    default: 15
    description: Introns shorter than this are flagged SMALL_INTRON. Default is reloftee's own.
  conda_env:
    type: ["string", "null"]
    default: null
    description: >-
      Name or path of an existing conda environment with the reloftee Python package
      installed. reloftee has no public git repository to install from, so
      `snakemake --sdm conda` cannot build a working environment on its own: the shared
      workflow/modules/veff/envs/veff-py.yaml only provides reloftee's other dependencies.
      Set this to an environment that already has reloftee installed.
  enabled:
    type: boolean
    default: false
    description: >-
      The veff module loads this module only with `enabled: true`. Its output is built only
      as a target, see output_dir. Off by default: reloftee needs an existing conda environment
      (`conda_env`), and its output is not read by tissue_specific_vep, fset or predict.

required:
  - vcf
  - output_dir
  - human_genome_version
  - fasta_file
  - genome_annotation

if:
  properties:
    enabled:
      const: true
  required:
    - enabled
then:
  properties:
    conda_env:
      type: string
      description: >-
        `enabled: true` needs `conda_env`: workflow/modules/veff/envs/veff-py.yaml lacks
        reloftee. Set it to an existing conda environment with the reloftee Python package.
  required:
    - conda_env
