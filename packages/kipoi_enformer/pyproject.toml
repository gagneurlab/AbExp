[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kipoi-enformer"
version = "0.0.1"
description = "Kipoi-based variant effect prediction around the TSS using Enformer"
authors = [
    { name = "Florian Hölzlwimmer", email = "git.ich@frhoelzlwimmer.de" },
    { name = "George Tsitsiridis", email = "gtsitsiridis@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["model zoo", "deep learning", "enformer", "aparent2",
    "computational biology", "bioinformatics", "genomics"]
dependencies = [
    "cyvcf2>=0.30.28",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "pyarrow",
    "kipoiseq2[vcf,ranges] @ git+https://github.com/kipoi/kipoiseq2.git@9f69c90a6d059fabcb6192ccb62acc6d0c79fddc",
    "tensorflow-hub>=0.16.1",
    # tensorflow-hub imports pkg_resources, which setuptools 82 removed
    "setuptools<82",
    "tensorflow>=2.14.0",
    "polars>=1.5.0",
    "polars-bio>=0.31",
    "scikit-learn>=1.4.1.post1",
    "lightgbm>=4.3.0",
    "zarr>=2.15.0",
    "xarray>=2024.5.0",
    "pyyaml",
    "tqdm",
]
[project.urls]
Homepage = "https://github.com/gagneurlab/AbExp"
Source = "https://github.com/gagneurlab/AbExp/tree/main/packages/kipoi_enformer"
Issues = "https://github.com/gagneurlab/AbExp/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "cython"
]