[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "abexp-utils"
version = "0.0.1"
description = "Utility functions for AbExp"
authors = [
    { name = "Florian Hölzlwimmer", email = "git.ich@frhoelzlwimmer.de" },
    { name = "George Tsitsiridis", email = "gtsitsiridis@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.6"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["model zoo", "deep learning",
    "computational biology", "bioinformatics", "genomics"]
dependencies = [
    "pyarrow",
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
]
[project.urls]
Homepage = "https://github.com/gagneurlab/AbExp"
Source = "https://github.com/gagneurlab/AbExp/tree/main/packages/abexp_utils"
Issues = "https://github.com/gagneurlab/AbExp/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "cython"
]
spark = [
    "pyspark>=3.4",
]
polars = [
    "polars~=1.36",
]
all = [
    "pyspark>=3.4",
    "polars~=1.36",
]

[tool.pytest.ini_options]
addopts = [
    # Pass -n0 to turn this off, which a debugger needs and which restores per-test output order.
    "-n", "auto",
    # one worker runs the Spark tests, see tests/test_spark.py
    "--dist", "loadgroup",
]
