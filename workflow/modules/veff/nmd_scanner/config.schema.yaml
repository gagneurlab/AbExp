$schema: "https://json-schema.org/draft/2020-12/schema"
title: nmd_scanner module
description: >-
  Scans variants for premature termination codons and evaluates the NMD escape rules with
  NMD-Scanner, on the transcripts of a GFF3 file. Writes NMD-Scanner's own per-transcript,
  per-variant table. Then predicts the NMD efficiency of each premature termination codon with
  NMD-Scanner's random forest, and aggregates it per variant, gene and GTEx tissue.
type: object
additionalProperties: false

properties:
  vcf:
    type: string
    pattern: "\\{vcf_file\\}"
    description: >-
      Input VCFs, left-normalized and single-allelic, as a pattern with the wildcard
      {vcf_file}, e.g. the stripped VCFs of the vcf_prep module.
  output_dir:
    type: string
    description: >-
      The outputs are in <output_dir>/nmd_scanner: NMD-Scanner's table in
      veff.parquet/<vcf_file>.parquet, the predicted NMD efficiency of the transcripts with a
      premature termination codon in score.parquet/<vcf_file>.parquet, and the NMD features per
      variant, gene and tissue in features.parquet/<vcf_file>.parquet.
  resources_dir:
    type: string
    description: Not used by this module; kept for consistency with the other veff submodules.
  human_genome_version:
    type: string
    enum: ["hg19", "hg38"]
  fasta_file:
    type: string
  fasta_file_idx:
    type: string
    description: Index of `fasta_file`. Default is `fasta_file` + ".fai".
  gff3_file:
    type: string
    description: >-
      Genome annotation (GFF3) from GENCODE or Ensembl. The veff module passes the pipeline's
      `gff3_file`.
  reassign_exons:
    type: boolean
    description: >-
      Recompute the exon numbers before the scan. NMD-Scanner recommends this for GENCODE
      annotations built against hg19, which numbered the exons of minus-strand transcripts
      the other way round; hg38 annotations do not need it. Default is true if
      human_genome_version is "hg19", false otherwise.
  isoform_proportions_pq:
    type: string
    description: >-
      GTEx isoform proportions as parquet, e.g. the one of the tissue_specific_vep module, which
      the veff module passes. The features rule reads the columns `gene` and `transcript`
      (Ensembl IDs without version), `tissue` (GTEx tissue, e.g. "Adipose - Subcutaneous") and
      `median_transcript_proportions`, and ignores the others. Without this key, the module has
      no features rule.
  conda_env:
    type: ["string", "null"]
    default: null
    description: >-
      Name or path of an existing conda environment with the nmd_scanner Python package. By
      default, `snakemake --sdm conda` creates envs/nmd_scanner_env.yaml, which installs it
      from PyPI.
  enabled:
    type: boolean
    default: false
    description: >-
      The veff module loads this module only with `enabled: true`. Its outputs are built only
      as targets, see output_dir. Off by default: NMD-Scanner needs its own conda environment
      and scans every variant against every overlapping transcript, and its output is not read
      by tissue_specific_vep, fset or predict.

required:
  - vcf
  - output_dir
  - human_genome_version
  - fasta_file
  - gff3_file
