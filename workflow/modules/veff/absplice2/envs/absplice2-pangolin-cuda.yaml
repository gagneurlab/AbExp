# abexp.pangolin, which runs the published Pangolin weights with PyTorch.
# absplice2-pangolin-cpu.yaml is the same with the CPU build of PyTorch.
name: abexp-absplice2-pangolin-cuda

channels:
- conda-forge
- bioconda

dependencies:
- python=3.12
- pytorch-gpu>=2.4 # the CUDA build of pytorch, also on hosts without a GPU
- numpy
- polars>=1.44
# not imported by the rules, but dependencies of aberrant-expression and kipoiseq2: conda installs them, not pip
- polars-bio>=0.36.0
- pyfaidx
- pip
- pip:
  # packages/aberrant_expression of this repository at its release tag. release-please bumps the tag.
  - "aberrant-expression[pangolin] @ git+https://github.com/gagneurlab/AbExp.git@aberrant-expression-v0.1.0#subdirectory=packages/aberrant_expression"  # x-release-please-version
