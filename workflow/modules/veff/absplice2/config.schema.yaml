$schema: "https://json-schema.org/draft/2020-12/schema"
title: absplice2 module
description: >-
  AbSplice2-DNA (https://github.com/gagneurlab/absplice2): aberrant splicing per GTEx tissue from
  MMSplice with SpliceMaps and from Pangolin. The module runs Pangolin (abexp.pangolin) and the
  AbSplice2-DNA model; the MMSplice table, the SpliceMaps and the tissue mapping come from the
  absplice module. Downloads the AbSplice2 model, unless `model_pkl` points at an existing file,
  and the Pangolin weights.
type: object
additionalProperties: false

properties:
  valid_vcf:
    type: string
    pattern: "\\{vcf_file\\}"
    description: >-
      VCFs with only valid REF and ALT alleles and with contig lines in the header, as a pattern
      with the wildcard {vcf_file}, e.g. the valid variant VCFs of the vcf_prep module. The
      same VCFs as for MMSplice.
  mmsplice_splicemap:
    type: string
    pattern: "\\{vcf_file\\}"
    description: >-
      MMSplice with SpliceMaps per VCF (CSV), e.g. the output of the rule
      veff__mmsplice_splicemap of the absplice module.
  splicemap_5:
    type: array
    items:
      type: string
    description: The psi5 SpliceMaps that MMSplice used, e.g. the input splicemap_5 of veff__mmsplice_splicemap.
  splicemap_3:
    type: array
    items:
      type: string
    description: The psi3 SpliceMaps that MMSplice used, e.g. the input splicemap_3 of veff__mmsplice_splicemap.
  tissue_mapping_csv:
    type: string
    description: >-
      Mapping of the SpliceMap tissue names to the AbExp tissue names (columns tissue and
      renamed_tissue). Default is resources/AbSplice_tissue_mapping.csv of the absplice module.
  output_dir:
    type: string
    description: >-
      The output is <output_dir>/absplice2/veff.parquet/<vcf_file>.parquet, the intermediate
      results are in <output_dir>/absplice2.
  resources_dir:
    type: string
    description: >-
      Base of the default `model_pkl` path and of the Pangolin weights,
      <resources_dir>/absplice2/pangolin_models. Default is <output_dir>/resources.
  human_genome_version:
    type: string
    enum: ["hg19", "hg38"]
  fasta_file:
    type: string
    description: >-
      Genome FASTA. Pangolin adds or removes the "chr" prefix of the VCF chromosome to match the
      FASTA, and looks up the genes under the FASTA name. So the FASTA must name the chromosomes
      like gff3_file: "chr1" for GENCODE.
  fasta_file_idx:
    type: string
    description: Index of `fasta_file`. Default is `fasta_file` + ".fai".
  gff3_file:
    type: string
    description: >-
      GENCODE genome annotation (GFF3, gzip allowed) of the same assembly as fasta_file. Pangolin
      scores the genes in it, and takes the annotated splice sites from its exons with one of
      `pangolin_transcript_tags`.
  pangolin_transcript_tags:
    type: array
    items:
      type: string
    description: >-
      Pangolin takes the annotated splice sites of a gene from its exons with one of these tags.
      Default are the tags of the databases published with Pangolin: Ensembl_canonical for
      hg38; Ensembl_canonical, appris_principal, appris_candidate and appris_candidate_longest
      for hg19.
  model_pkl:
    type: string
    description: >-
      The AbSplice2-DNA model. Default is <resources_dir>/absplice2/AbSplice_2_DNA.pkl,
      downloaded if missing (0.7 MB).
  use_gpu:
    type: boolean
    default: false
    description: >-
      Run the Pangolin rule in the CUDA variant of the PyTorch environment
      (envs/absplice2-pangolin-cuda.yaml of this module) instead of the CPU variant. The CUDA
      variant also runs on hosts without a GPU. The veff module sets this from its own use_gpu.
  enabled:
    type: boolean
    default: false
    description: >-
      The veff module loads this module only with `enabled: true`. Its output is built only as
      a target, see output_dir. Off by default: Pangolin is slow without a GPU, about 0.7 s per
      variant with 4 CPU threads, and the output is not read by tissue_specific_vep, fset or
      predict.

required:
  - valid_vcf
  - mmsplice_splicemap
  - splicemap_5
  - splicemap_3
  - output_dir
  - human_genome_version
  - fasta_file
  - gff3_file
