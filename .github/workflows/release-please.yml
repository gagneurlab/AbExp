# Releases the workflow and the Python package in packages/ with release-please. See packages/README.md.
# Publishing to PyPI runs only if the repository variable PYPI_PUBLISH is 'true'.
name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      # the released paths in packages/, as a JSON list
      packages_released: ${{ steps.packages.outputs.paths }}
      # all outputs, to look up per-path outputs such as packages/aberrant_expression--tag_name
      release: ${{ toJSON(steps.release.outputs) }}
    steps:
      # reads release-please-config.json and .release-please-manifest.json
      - id: release
        uses: googleapis/release-please-action@v5
      # The release of the workflow (path ".") is only a tag and a GitHub release, without a build.
      - id: packages
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released || '[]' }}
        run: echo "paths=$(jq -c 'map(select(startswith("packages/")))' <<< "$PATHS_RELEASED")" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.path }}
    needs: release-please
    if: contains(needs.release-please.outputs.packages_released, 'packages/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.packages_released) }}
    env:
      PACKAGE_PATH: ${{ matrix.path }}
      TAG: ${{ fromJSON(needs.release-please.outputs.release)[format('{0}--tag_name', matrix.path)] }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # reads the uv version from required-version
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
      - run: uv build "$PACKAGE_PATH" --out-dir dist
      - run: uvx twine check --strict dist/*
      - name: Check for direct URL dependencies
        env:
          PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
        run: |
          # PyPI rejects a Requires-Dist with a direct URL ("name @ url").
          # This fails the build only if the upload to PyPI is on.
          unzip -p dist/*.whl '*.dist-info/METADATA' | grep '^Requires-Dist: .* @ ' > direct-urls.txt || true
          level=warning
          if [ "$PYPI_PUBLISH" = true ]; then level=error; fi
          while IFS= read -r line; do
            echo "::$level title=Direct URL dependency::$TAG: PyPI rejects ${line#Requires-Dist: }"
          done < direct-urls.txt
          if [ "$level" = error ] && [ -s direct-urls.txt ]; then exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ env.TAG }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
