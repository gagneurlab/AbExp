# Tests and builds the Python package aberrant-expression in packages/. See packages/README.md.
name: packages

on:
  pull_request:
    paths:
      - "packages/**"
      # the abexp.enformer tests read these example files
      - "example/chr22_hg19.fa*"
      - "example/chr22.gencode.v40lift37.annotation.gff3.gz"
      # the splicing tests read this example file
      - "example/chr22_hg38.fa*"
      - ".github/workflows/packages.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      # the abexp.enformer tests read these example files
      - "example/chr22_hg19.fa*"
      - "example/chr22.gencode.v40lift37.annotation.gff3.gz"
      # the splicing tests read this example file
      - "example/chr22_hg38.fa*"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.area }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # abexp.utils
          - area: utils
            extras: polars,spark,gff3
          # abexp.enformer
          - area: enformer
            extras: enformer
          # abexp.mmsplice, abexp.absplice and abexp.spliceai_rocksdb, without the extra rocksdb: python-rocksdb needs
          # the RocksDB library, and the SpliceAI-RocksDB test needs the 2.6 GB database, so pytest skips that test
          - area: splicing
            extras: splicing
          # abexp.pangolin, with small test models instead of the published weights
          - area: pangolin
            extras: pangolin
    env:
      TEST_DATA: packages/aberrant_expression/tests/enformer/data/**
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - name: Hash the list of LFS objects in the test data
        if: matrix.area == 'enformer'
        id: lfs
        run: echo "hash=$(git lfs ls-files --long --include="$TEST_DATA" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: matrix.area == 'enformer'
        with:
          path: .git/lfs
          key: lfs-enformer-test-data-${{ steps.lfs.outputs.hash }}
      # .lfsconfig excludes the test data from the default fetch; --exclude="" lifts that
      - name: Fetch the test data from git-lfs
        if: matrix.area == 'enformer'
        run: git lfs pull --include="$TEST_DATA" --exclude=""
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/aberrant_expression/pyproject.toml
      # the spark tests need Java; pyspark 3.4 and later support Java 17
      - uses: actions/setup-java@v6
        if: matrix.area == 'utils'
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install "./packages/aberrant_expression[${{ matrix.extras }},dev]"
      - run: pytest "tests/${{ matrix.area }}"
        working-directory: packages/aberrant_expression

  # A fresh install of one extra imports all modules of its subpackages, so that a missing requirement fails.
  imports:
    name: imports of ${{ matrix.extra || 'the base' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # also imports its parents abexp and abexp.utils, but no other subpackage
          - extra: ""
            modules: abexp.utils.common
          - extra: models
            modules: abexp.utils.models
          - extra: polars
            modules: abexp.utils.polars_functions
          - extra: spark
            modules: abexp.utils.spark_functions
          - extra: gff3
            modules: abexp.utils.gff3
          # Without the extra rocksdb, because pip builds python-rocksdb only with the RocksDB library installed.
          # abexp.spliceai_rocksdb imports python-rocksdb only when it opens a database.
          - extra: splicing
            modules: abexp.mmsplice abexp.absplice abexp.spliceai_rocksdb
          - extra: enformer
            modules: abexp.enformer
          - extra: pangolin
            modules: abexp.pangolin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/aberrant_expression/pyproject.toml
      - env:
          EXTRA: ${{ matrix.extra }}
        run: pip install "./packages/aberrant_expression${EXTRA:+[$EXTRA]}"
      # -I: import the installed package, not the checkout
      - env:
          MODULES: ${{ matrix.modules }}
        run: |
          python -I - $MODULES <<'EOF'
          import importlib
          import pkgutil
          import sys

          for name in sys.argv[1:]:
              module = importlib.import_module(name)
              print(name)
              for info in pkgutil.walk_packages(getattr(module, '__path__', []), f'{name}.'):
                  importlib.import_module(info.name)
                  print(info.name)
          EOF

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build packages/aberrant_expression --outdir dist
      - run: twine check --strict dist/*
      - name: Warn about direct URL dependencies
        run: |
          # PyPI rejects a Requires-Dist with a direct URL ("name @ url")
          unzip -p dist/*.whl '*.dist-info/METADATA' | grep '^Requires-Dist: .* @ ' > direct-urls.txt || true
          while IFS= read -r line; do
            echo "::warning title=Direct URL dependency::PyPI rejects ${line#Requires-Dist: }"
          done < direct-urls.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
