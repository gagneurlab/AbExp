name: abexp-absplice
channels:
  - conda-forge
dependencies:
  - python=3.12 # the newest Python with tensorflow 2.21 builds on conda-forge
  - cython
  - pytest
  - setuptools<82 # absplice, mmsplice and spliceai import pkg_resources, which setuptools 82 removed
  - scipy
  - pandas
  - tqdm
  - click
  - pyarrow
  - tensorflow-cpu=2.21 # the CPU build of tensorflow 2.21, also on hosts with a CUDA driver
  - onnx
  - onnxruntime
  - pandas
  - numpy>=1.23,<2
  # needed for splicemap
  - seaborn
  - scikit-learn
  - bioconda::pyfaidx
  - bioconda::cyvcf2
  - bioconda::pyranges>=0.0.71
  - bioconda::tabix
  - bioconda::spliceai
  - bioconda::kipoiseq>=0.7
  - deepdiff
  # post-deploy.sh installs the pip packages. An empty "pip:" section breaks the YAML parser of micromamba.
  - pip
