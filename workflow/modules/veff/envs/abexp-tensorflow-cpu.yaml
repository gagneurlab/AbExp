# TensorFlow environment of the modules enformer and absplice (MMSplice, SpliceAI, SpliceAI-RocksDB and
# AbSplice-DNA).
# abexp-tensorflow-cuda.yaml is the same with the CUDA build of TensorFlow.
name: abexp-tensorflow-cpu
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12 # the newest Python with tensorflow 2.21 builds on conda-forge
  - tensorflow-cpu=2.21 # the CPU build of tensorflow 2.21, also on hosts with a CUDA driver
  - pandas
  - pyarrow
  - polars~=1.44
  - xarray
  # not imported by the rules, but dependencies of kipoi-enformer and kipoiseq2: conda installs them instead of pip
  - kagglehub # downloads the Enformer model
  - scikit-learn
  - zarr
  - polars-bio
  - pyfaidx
  # dependencies of spliceai and abexp-splicing
  - pysam
  - python-rocksdb>=0.7
  - tqdm
  - click
  - onnxruntime # runs the AbSplice-DNA model of abexp-splicing
  - pip
  - pip:
    # packages/kipoi_enformer of this repository at its release tag. release-please bumps the tag.
    - "kipoi-enformer @ git+https://github.com/gagneurlab/AbExp.git@kipoi-enformer-v0.0.1#subdirectory=packages/kipoi_enformer"  # x-release-please-version
    # SpliceAI of the branch mnp, which predicts multi-nucleotide variants
    - "spliceai @ git+https://github.com/hoeze/SpliceAI.git@e3470ae185d1418fe40cf35e8c4e33431cbc5df2"
    # packages/abexp_splicing of this repository at its release tag. release-please bumps the tag.
    - "abexp-splicing[rocksdb] @ git+https://github.com/gagneurlab/AbExp.git@abexp-splicing-v0.0.1#subdirectory=packages/abexp_splicing"  # x-release-please-version
