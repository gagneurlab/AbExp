[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aberrant-expression"
version = "0.0.1"
description = "MMSplice, AbSplice-DNA and SpliceAI-RocksDB for the AbExp pipeline, on kipoiseq2"
# the authors of the ported code of mmsplice, absplice, splicemap and spliceai_rocksdb
authors = [
    { name = "Jun Cheng" },
    { name = "Muhammed Hasan Çelik" },
    { name = "Nils Wagner" },
]
maintainers = [
    { name = "Florian Hölzlwimmer", email = "git.ich@frhoelzlwimmer.de" },
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["splicing", "variant effect prediction", "mmsplice", "absplice", "spliceai",
    "computational biology", "bioinformatics", "genomics"]
dependencies = [
    "numpy>=1.26.4",
    "polars>=1.44",
    "kipoiseq2[ranges]>=0.1,<0.2",
    "tensorflow>=2.14.0",
    "onnxruntime",
    "tqdm",
]

[project.optional-dependencies]
# SpliceAI-RocksDB (abexp.spliceai_rocksdb). SpliceAI predictions of the variants that are not in the database
# also need spliceai, see the README.
rocksdb = [
    "python-rocksdb>=0.7",
]
dev = [
    "pytest",
    "pytest-xdist",
]

[project.urls]
Homepage = "https://github.com/gagneurlab/AbExp"
Source = "https://github.com/gagneurlab/AbExp/tree/main/packages/aberrant_expression"
Issues = "https://github.com/gagneurlab/AbExp/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abexp*"]

[tool.setuptools.package-data]
"abexp.mmsplice" = ["models/*.h5"]
"abexp.absplice" = ["precomputed/*"]

[tool.pytest.ini_options]
addopts = [
    # Pass -n0 to turn this off, which a debugger needs and which restores per-test output order.
    "-n", "auto",
]
