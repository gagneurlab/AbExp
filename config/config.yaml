projectTitle: AbExp

vcf_input_dir: "example/clinvar_chr22"
# set this to True if you are sure that the variants are already normalized
# and contig names start with "chr"
vcf_is_normalized: False

output_dir: "example/output_hg38"
# output_dir: "example/output_hg19"

predict_abexp_models:
  - "abexp_v1.1"
#  - "abexp_v1.1_Enformer"
#  - "abexp_v1.1_nobcv"


human_genome_version: "hg38"
# human_genome_version: "hg19"

fasta_file: "example/chr22_hg38.fa"
# fasta_file: "example/chr22_hg19.fa"

# fasta file index is by default `fasta_file + ".fai"` but could be changed here:
# fasta_file_idx: "example/chr22_hg38.fa.fai"
# fasta_file_idx: "example/chr22_hg19.fa.fai"

# GENCODE genome annotation (GFF3)
gff3_file: "example/chr22.gencode.v40.annotation.gff3.gz"
# gff3_file: "example/chr22.gencode.v40lift37.annotation.gff3.gz"

veff:
  # tool for the transcript consequence annotation: "vep" (default) or "mehari".
  annotator: "vep"
  # only for "mehari": GENCODE transcript sequences (FASTA) of the same release as
  # `gff3_file`. The pipeline builds the mehari transcript database from the two files;
  # misc/mehari/download_gencode.sh fetches them. See "Using mehari instead of VEP" in the
  # README.
  # mehari_gencode_transcripts_fasta: "data/gencode/release_40/gencode.v40.transcripts.fa.gz"

# Run Enformer, SpliceAI and Pangolin in the CUDA variant of their environment. It also runs
# on hosts without a GPU. See "GPU" in the README.
use_gpu: False

# mapping of chromosome names. By default, maps them to "chr" prefix
# (workflow/modules/vcf_prep/resources/chromAlias.tsv).
# chrom_alias_tsv: "my_chromAlias.tsv"

# Settings of the local installation. All options and their defaults are in
# workflow/schemas/config.schema.yaml; the options of each veff module, e.g. vep, are in
# workflow/modules/veff/<module>/config.schema.yaml.
system:
  # Downloaded resources, e.g. the VEP cache, CADD and LOFTEE: more than 100 GB. The default
  # <output_dir>/resources gives each output folder its own copy. Set a shared folder instead,
  # so that all output folders use one copy.
  # dirs:
  #   resources_dir: "/data/abexp-resources"

  vep:
    version: 108
    vep_bin: "vep"
    perl_bin: "perl"
    # By default, the pipeline downloads the VEP cache, CADD and LOFTEE into resources_dir.
    # Set these to reuse existing caches instead:
    # vep_cache_dir: "/path/to/vep_cache/{vep_version}"
    # cadd_dir: "/path/to/cadd/v1.6/{human_genome_assembly}"
    # loftee_data_dir: "/path/to/loftee/{human_genome_assembly}"
    # loftee_src_path: "/path/to/loftee/{human_genome_assembly}_src"

  # mehari:
  #   conda_env: "abexp-mehari"

  # reloftee on `gff3_file`; needs an existing conda environment with reloftee. It reads the
  # LOFTEE data files of the vep settings above. Its output
  # <output_dir>/veff/loftee/veff.parquet/<vcf_file>.parquet is built only as a target.
  # loftee:
  #   enabled: True
  #   conda_env: "reloftee"

  # NMD-Scanner 0.2.0 reads only GTF: set the GTF of the same GENCODE release
  # nmd_scanner:
  #   enabled: True
  #   gtf_file: "data/gencode/release_40/gencode.v40.annotation.gtf.gz"


  #enformer:
  #  download_reference: True
  #  batch_size: 2
  # variant_upstream_tss: 50
  # variant_downstream_tss: 200

  # absplice:
  #   splicemap:
  #     psi3: '/path/to/splicemaps/splicemap_{genome}/{tissue}_splicemap_psi3_method=kn_event_filter=median_cutoff.csv.gz'
  #     psi5: '/path/to/splicemaps/splicemap_{genome}/{tissue}_splicemap_psi5_method=kn_event_filter=median_cutoff.csv.gz'
  #   use_spliceai_rocksdb: True
  #   spliceai_rocksdb_path:
  #     hg19: '/path/to/spliceai_rocksdb/spliceAI_hg19_chr{chromosome}.db'
  #     hg38: '/path/to/spliceai_rocksdb/spliceAI_hg38_chr{chromosome}.db'

  # AbSplice2-DNA: Pangolin with the MMSplice and SpliceMap results of absplice. Its output
  # <output_dir>/veff/absplice2/veff.parquet/<vcf_file>.parquet is built only as a target.
  # absplice2:
  #   enabled: True
