# Tests and builds the Python package aberrant-expression in packages/. See packages/README.md.
# ci.yml calls it when a change touches the files that its job `changes` lists for this workflow.
name: packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.area }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # abexp.utils
          - area: utils
            extras: polars,spark,gff3
          # abexp.enformer
          - area: enformer
            extras: enformer
          # abexp.mmsplice, abexp.absplice and abexp.spliceai_rocksdb, without the extra rocksdb: python-rocksdb needs
          # the RocksDB library, and the SpliceAI-RocksDB test needs the 2.6 GB database, so pytest skips that test
          - area: splicing
            extras: splicing
          # abexp.pangolin, with small test models and with the published weights of Pangolin
          - area: pangolin
            extras: pangolin
          # abexp.absplice2, with a stand-in for the AbSplice2 model
          - area: absplice2
            extras: absplice2
    env:
      TEST_DATA: packages/aberrant_expression/tests/enformer/data/**
      # the pangolin tests download the published weights of Pangolin into this folder
      ABEXP_PANGOLIN_MODELS_DIR: ${{ github.workspace }}/pangolin_models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: Hash the list of LFS objects in the test data
        if: matrix.area == 'enformer'
        id: lfs
        run: echo "hash=$(git lfs ls-files --long --include="$TEST_DATA" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.area == 'enformer'
        with:
          path: .git/lfs
          key: lfs-enformer-test-data-${{ steps.lfs.outputs.hash }}
      # .lfsconfig excludes the test data from the default fetch; --exclude="" lifts that
      - name: Fetch the test data from git-lfs
        if: matrix.area == 'enformer'
        run: git lfs pull --include="$TEST_DATA" --exclude=""
      # weights.py holds the SHA-256 sums of the weights, so a new list of weights gets a new key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.area == 'pangolin'
        with:
          path: pangolin_models
          key: pangolin-weights-${{ hashFiles('packages/aberrant_expression/src/abexp/pangolin/weights.py') }}
      # reads the uv version from required-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
      # the spark tests need Java; pyspark 3.4 and later support Java 17
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.area == 'utils'
        with:
          distribution: temurin
          java-version: "17"
      - env:
          EXTRAS: ${{ matrix.extras }}
        run: uv sync --locked --extra "$EXTRAS" --group test
      - run: uv run pytest "tests/${{ matrix.area }}"
        working-directory: packages/aberrant_expression

  # A fresh install of one extra imports all modules of its subpackages, so that a missing requirement fails.
  imports:
    name: imports of ${{ matrix.extra || 'the base' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # also imports its parents abexp and abexp.utils, but no other subpackage
          - extra: ""
            modules: abexp.utils.common
          - extra: models
            modules: abexp.utils.models
          - extra: polars
            modules: abexp.utils.polars_functions
          - extra: spark
            modules: abexp.utils.spark_functions
          - extra: gff3
            modules: abexp.utils.gff3
          # Without the extra rocksdb, because uv builds python-rocksdb only with the RocksDB library installed.
          # abexp.spliceai_rocksdb imports python-rocksdb only when it opens a database.
          # MMSplice imports TensorFlow only when it loads its models, but abexp.mmsplice.layers imports it at the
          # top, so this job still checks it. abexp.absplice imports onnxruntime only to run AbSplice-DNA, so this
          # job does not check onnxruntime.
          - extra: splicing
            modules: abexp.mmsplice abexp.absplice abexp.spliceai_rocksdb
          - extra: enformer
            modules: abexp.enformer
          - extra: pangolin
            modules: abexp.pangolin
          - extra: absplice2
            modules: abexp.absplice2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      # reads the uv version from required-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
      # --no-editable: install the package as a wheel, as pip does from the git tag
      - env:
          EXTRA: ${{ matrix.extra }}
        run: uv sync --locked --no-editable ${EXTRA:+--extra "$EXTRA"}
      # -I: import the installed package, not the checkout
      - env:
          MODULES: ${{ matrix.modules }}
        run: |
          uv run --no-sync python -I - $MODULES <<'EOF'
          import importlib
          import pkgutil
          import sys

          for name in sys.argv[1:]:
              module = importlib.import_module(name)
              print(name)
              for info in pkgutil.walk_packages(getattr(module, '__path__', []), f'{name}.'):
                  importlib.import_module(info.name)
                  print(info.name)
          EOF

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # reads the uv version from required-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
      - run: uv build packages/aberrant_expression --out-dir dist
      - run: uvx twine check --strict dist/*
      - name: Warn about direct URL dependencies
        run: |
          # PyPI rejects a Requires-Dist with a direct URL ("name @ url")
          unzip -p dist/*.whl '*.dist-info/METADATA' | grep '^Requires-Dist: .* @ ' > direct-urls.txt || true
          while IFS= read -r line; do
            echo "::warning title=Direct URL dependency::PyPI rejects ${line#Requires-Dist: }"
          done < direct-urls.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
